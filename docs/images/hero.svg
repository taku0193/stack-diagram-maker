<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Stack Diagram Maker</title>
  <desc id="description">An HTML document flows into a library, which connects to preview and open actions.</desc>
  <defs>
    <linearGradient id="background" x2="100%" y2="100%">
      <stop stop-color="#101427"/>
      <stop offset="1" stop-color="#080b16"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#735cff" stop-opacity=".27"/>
      <stop offset="1" stop-color="#735cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop stop-color="#9f9bff"/>
      <stop offset="1" stop-color="#83e8ff"/>
    </linearGradient>
    <linearGradient id="node" x2="100%" y2="100%">
      <stop stop-color="#29264c"/>
      <stop offset="1" stop-color="#141b31"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#adb9f3" fill-opacity=".2"/>
    </pattern>
    <clipPath id="canvas">
      <rect width="1280" height="360" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1280" height="360" fill="url(#background)"/>
    <ellipse cx="950" cy="154" rx="460" ry="280" fill="url(#halo)"/>
    <rect x="624" y="24" width="600" height="312" fill="url(#grid)"/>
    <path d="M624 73V48h25m550 0h25v25m0 214v25h-25m-550 0h-25v-25"
          fill="none" stroke="#4b527e" stroke-width="1.5"/>
    <rect x="1" y="1" width="1278" height="358" rx="23" fill="none" stroke="#323756" stroke-width="2"/>
  </g>

  <g transform="translate(66 60)">
    <rect width="36" height="36" rx="10" fill="#242447" stroke="#55558e"/>
    <path d="m8 15 10-6 10 6-10 6zM8 20l10 6 10-6m-20 5 10 6 10-6"
          fill="none" stroke="url(#accent)" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="24" fill="#b9c3ea" font-family="ui-monospace, Menlo, monospace" font-size="16"
          letter-spacing="2.5">LOCAL DIAGRAM LIBRARY</text>
  </g>

  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="750" letter-spacing="-3.5">
    <text x="64" y="185" fill="#f4f6ff">Stack Diagram</text>
    <text x="64" y="262" fill="#a4cbff">Maker</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M773 177h87m120 0h31q14 0 14-14v-40q0-14 14-14h48m-107 68h31q14 0 14 14v40q0 14 14 14h48"
          stroke="#333957" stroke-width="9"/>
    <path d="M773 177h87m120 0h31q14 0 14-14v-40q0-14 14-14h48m-107 68h31q14 0 14 14v40q0 14 14 14h48"
          stroke="url(#accent)" stroke-width="2"/>
    <path d="m852 171 8 6-8 6m227-80 8 6-8 6m0 124 8 6-8 6" stroke="#96d9ff" stroke-width="2"/>
  </g>

  <g transform="translate(685 133)">
    <rect width="88" height="88" rx="22" fill="url(#node)" stroke="#67649a" stroke-width="1.5"/>
    <path d="M29 24h19l12 12v28H29zM48 24v12h12M37 46h15m-15 8h15"
          fill="none" stroke="#bdbaff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(870 127)">
    <rect x="-8" y="-8" width="116" height="116" rx="32" fill="#8d85ff" fill-opacity=".09" stroke="#756cf2" stroke-opacity=".35"/>
    <rect width="100" height="100" rx="25" fill="url(#node)" stroke="url(#accent)" stroke-width="2"/>
    <path d="m26 40 24-14 24 14-24 14zM26 50l24 14 24-14M26 60l24 14 24-14"
          fill="none" stroke="url(#accent)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(1097 76)">
    <rect width="66" height="66" rx="18" fill="url(#node)" stroke="#5c81aa" stroke-width="1.5"/>
    <rect x="18" y="21" width="30" height="24" rx="4" fill="none" stroke="#9ce6ff" stroke-width="2.2"/>
    <path d="M18 28h30m-19 8 3 3-3 3m7 0h5" fill="none" stroke="#9ce6ff" stroke-width="1.7" stroke-linecap="round"/>
  </g>

  <g transform="translate(1097 212)">
    <rect width="66" height="66" rx="18" fill="url(#node)" stroke="#5c81aa" stroke-width="1.5"/>
    <path d="M32 21H21v24h24V34m-12-1 13-13m-10 0h10v10"
          fill="none" stroke="#9ce6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#c1c8ea" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.5" text-anchor="middle">
    <text x="729" y="247">HTML</text>
    <text x="920" y="253">LIBRARY</text>
    <text x="1130" y="166">PREVIEW</text>
    <text x="1130" y="302">OPEN</text>
  </g>
</svg>
